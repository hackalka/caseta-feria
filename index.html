<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Socios - Caseta de Feria</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Navegación -->
    <header class="bg-red-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-tent text-2xl text-amber-300"></i>
                <h1 class="text-xl font-bold tracking-wide">Caseta "Los Manolos" — Control de Socios</h1>
            </div>
            <button onclick="abrirModal()" class="bg-amber-400 hover:bg-amber-300 text-red-950 font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Nuevo Socio
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">

        <!-- Estadísticas -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs uppercase font-bold text-slate-400">Total Socios</p>
                <p id="stat-total" class="text-3xl font-extrabold text-slate-800 mt-1">0</p>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs uppercase font-bold text-green-600">Al Día</p>
                <p id="stat-pagados" class="text-3xl font-extrabold text-green-600 mt-1">0</p>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs uppercase font-bold text-amber-600">Pendientes</p>
                <p id="stat-pendientes" class="text-3xl font-extrabold text-amber-600 mt-1">0</p>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs uppercase font-bold text-red-600">Atrasados</p>
                <p id="stat-atrasados" class="text-3xl font-extrabold text-red-600 mt-1">0</p>
            </div>
        </div>

        <!-- Buscador -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                <input type="text" id="input-buscar" oninput="filtrarTabla()" placeholder="Buscar por socio o Nº..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 text-sm">
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <select id="filtro-estado" onchange="filtrarTabla()" class="w-full md:w-auto px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 text-sm bg-white">
                    <option value="TODOS">Todos los estados</option>
                    <option value="Pagado">Pagado</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="Atrasado">Atrasado</option>
                </select>
            </div>
        </div>

        <!-- Tabla de Socios -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500 uppercase tracking-wider">
                            <th class="p-4">Nº</th>
                            <th class="p-4">Nombre Completo</th>
                            <th class="p-4">Contacto</th>
                            <th class="p-4">Cuota Estipulada</th>
                            <th class="p-4">Estado Pago</th>
                            <th class="p-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-socios" class="divide-y divide-slate-100 text-sm">
                        <tr><td colspan="6" class="p-6 text-center text-slate-400">Conectando con Firebase...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="modal-socio" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
            <div class="bg-red-700 px-6 py-4 text-white flex justify-between items-center">
                <h3 id="modal-titulo" class="font-bold text-lg">Registrar Nuevo Socio</h3>
                <button onclick="cerrarModal()" class="text-white hover:text-amber-300 text-xl font-bold">&times;</button>
            </div>
            <form id="form-socio" onsubmit="guardarSocio(event)" class="p-6 space-y-4">
                <input type="hidden" id="socio-id">
                
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Número de Socio</label>
                    <input type="number" id="socio-num" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Nombre Completo</label>
                    <input type="text" id="socio-nombre" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Teléfono (ej. 600112233)</label>
                    <input type="tel" id="socio-telefono" required placeholder="600000000" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Cuota (€)</label>
                        <input type="number" id="socio-cuota" required value="150" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Estado</label>
                        <select id="socio-estado" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none bg-white">
                            <option value="Pagado">Pagado</option>
                            <option value="Pendiente">Pendiente</option>
                            <option value="Atrasado">Atrasado</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="cerrarModal()" class="px-4 py-2 border text-slate-600 rounded-lg hover:bg-slate-50 font-semibold text-sm">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-red-700 hover:bg-red-800 text-white rounded-lg font-semibold text-sm shadow">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SDK Firebase Configurado -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Configuración oficial de tu proyecto
        const firebaseConfig = {
            apiKey: "AIzaSyB6_1m_Cpx4PowfpNq1nXwpLHm2RAOvy8w",
            authDomain: "casetaferia-1bd4f.firebaseapp.com",
            databaseURL: "https://casetaferia-1bd4f-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "casetaferia-1bd4f",
            storageBucket: "casetaferia-1bd4f.firebasestorage.app",
            messagingSenderId: "404103026231",
            appId: "1:404103026231:web:1f5bbcc26828f20969d1b2"
        };

        // Inicializar Firebase Realtime Database
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const sociosRef = ref(db, 'socios');

        let socios = [];

        // Escuchar datos en tiempo real desde Realtime Database
        onValue(sociosRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                socios = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                }));
            } else {
                socios = [];
            }
            filtrarTabla();
        });

        // Guardar o Actualizar Socio
        window.guardarSocio = async function(e) {
            e.preventDefault();
            
            const id = document.getElementById('socio-id').value;
            const numero = parseInt(document.getElementById('socio-num').value);
            const nombre = document.getElementById('socio-nombre').value;
            let telefono = document.getElementById('socio-telefono').value.replace(/\s+/g, '');
            
            // Añadir prefijo 34 de España si falta
            if (!telefono.startsWith('34') && telefono.length === 9) {
                telefono = '34' + telefono;
            }

            const cuota = parseFloat(document.getElementById('socio-cuota').value);
            const estado = document.getElementById('socio-estado').value;

            const datosSocio = { numero, nombre, telefono, cuota, estado };

            if (id) {
                // Editar socio existente
                const socioRefExact = ref(db, `socios/${id}`);
                await update(socioRefExact, datosSocio);
            } else {
                // Crear nuevo socio
                const nuevoSocioRef = push(sociosRef);
                await set(nuevoSocioRef, datosSocio);
            }

            // Si el pago está completado, se genera el aviso de WhatsApp
            if (estado === 'Pagado') {
                enviarWhatsAppPago(nombre, telefono, cuota);
            }

            cerrarModal();
        };

        // Eliminar Socio
        window.eliminarSocio = async function(id) {
            if (confirm('¿Estás seguro de que quieres eliminar este socio?')) {
                const socioRefExact = ref(db, `socios/${id}`);
                await remove(socioRefExact);
            }
        };

        // Cambio rápido de Estado al hacer clic en el botón de rotación
        window.cambiarEstadoRapido = async function(id) {
            const socio = socios.find(s => s.id === id);
            if (!socio) return;

            let nuevoEstado = "Pendiente";
            if (socio.estado === 'Pendiente') nuevoEstado = 'Pagado';
            else if (socio.estado === 'Pagado') nuevoEstado = 'Atrasado';

            const socioRefExact = ref(db, `socios/${id}`);
            await update(socioRefExact, { estado: nuevoEstado });

            if (nuevoEstado === 'Pagado') {
                enviarWhatsAppPago(socio.nombre, socio.telefono, socio.cuota);
            }
        };

        // Filtrar y Buscar
        window.filtrarTabla = function() {
            const texto = document.getElementById('input-buscar').value.toLowerCase();
            const estado = document.getElementById('filtro-estado').value;

            const resultado = socios.filter(socio => {
                const coincideTexto = socio.nombre.toLowerCase().includes(texto) || socio.numero.toString().includes(texto);
                const coincideEstado = estado === 'TODOS' || socio.estado === estado;
                return coincideTexto && coincideEstado;
            });

            renderizarTabla(resultado);
        };

        function renderizarTabla(lista) {
            const tbody = document.getElementById('tabla-socios');
            tbody.innerHTML = '';

            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">No hay socios registrados todavía.</td></tr>`;
                actualizarEstadisticas(lista);
                return;
            }

            lista.sort((a, b) => a.numero - b.numero).forEach(socio => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                
                let badgeClass = "";
                if (socio.estado === 'Pagado') badgeClass = "bg-green-100 text-green-700 border-green-200";
                else if (socio.estado === 'Pendiente') badgeClass = "bg-amber-100 text-amber-700 border-amber-200";
                else badgeClass = "bg-red-100 text-red-700 border-red-200";

                tr.innerHTML = `
                    <td class="p-4 font-bold text-slate-600">#${socio.numero}</td>
                    <td class="p-4 font-semibold text-slate-800">${socio.nombre}</td>
                    <td class="p-4 text-slate-500"><i class="fa-solid fa-phone text-xs mr-1"></i>+${socio.telefono}</td>
                    <td class="p-4 font-bold text-slate-700">${socio.cuota} €</td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 text-xs font-bold rounded-full border ${badgeClass}">
                            ${socio.estado}
                        </span>
                    </td>
                    <td class="p-4 text-center">
                        <div class="flex justify-center gap-2">
                            <button onclick="enviarWhatsAppPago('${socio.nombre}', '${socio.telefono}', ${socio.cuota})" title="Enviar WhatsApp de Pago" class="p-1.5 bg-green-50 hover:bg-green-100 text-green-600 rounded">
                                <i class="fa-brands fa-whatsapp font-bold"></i>
                            </button>
                            <button onclick="cambiarEstadoRapido('${socio.id}')" title="Cambiar Estado" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded">
                                <i class="fa-solid fa-rotate"></i>
                            </button>
                            <button onclick="editarSocio('${socio.id}')" title="Editar Socio" class="p-1.5 bg-slate-100 hover:bg-blue-100 text-blue-600 rounded">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="eliminarSocio('${socio.id}')" title="Eliminar Socio" class="p-1.5 bg-slate-100 hover:bg-red-100 text-red-600 rounded">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            actualizarEstadisticas(socios);
        }

        function actualizarEstadisticas(lista) {
            document.getElementById('stat-total').innerText = lista.length;
            document.getElementById('stat-pagados').innerText = lista.filter(s => s.estado === 'Pagado').length;
            document.getElementById('stat-pendientes').innerText = lista.filter(s => s.estado === 'Pendiente').length;
            document.getElementById('stat-atrasados').innerText = lista.filter(s => s.estado === 'Atrasado').length;
        }

        // Abrir WhatsApp con el recibo de pago
        window.enviarWhatsAppPago = function(nombre, telefono, cuota) {
            const mensaje = `Hola *${nombre}*, te confirmamos que hemos recibido correctamente el pago de tu cuota de socio de la caseta por un importe de *${cuota}€*. ¡Muchas gracias y nos vemos en la Feria! 🎉🎪`;
            const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        };

        window.abrirModal = function() {
            document.getElementById('form-socio').reset();
            document.getElementById('socio-id').value = '';
            document.getElementById('modal-titulo').innerText = 'Registrar Nuevo Socio';
            
            const maxNum = socios.reduce((max, s) => s.numero > max ? s.numero : max, 0);
            document.getElementById('socio-num').value = maxNum + 1;

            document.getElementById('modal-socio').classList.remove('hidden');
            document.getElementById('modal-socio').classList.add('flex');
        };

        window.cerrarModal = function() {
            document.getElementById('modal-socio').classList.add('hidden');
            document.getElementById('modal-socio').classList.remove('flex');
        };

        window.editarSocio = function(id) {
            const socio = socios.find(s => s.id === id);
            if (!socio) return;

            document.getElementById('socio-id').value = socio.id;
            document.getElementById('socio-num').value = socio.numero;
            document.getElementById('socio-nombre').value = socio.nombre;
            document.getElementById('socio-telefono').value = socio.telefono;
            document.getElementById('socio-cuota').value = socio.cuota;
            document.getElementById('socio-estado').value = socio.estado;

            document.getElementById('modal-titulo').innerText = 'Editar Socio';
            
            document.getElementById('modal-socio').classList.remove('hidden');
            document.getElementById('modal-socio').classList.add('flex');
        };
    </script>
</body>
</html>
